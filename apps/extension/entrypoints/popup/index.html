<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fluid Deck</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1 class="popup__brand">Fluid Deck</h1>
      </header>

      <section class="popup__page" aria-label="Current page">
        <p class="popup__title" id="page-title">Checking this tab…</p>
        <p class="popup__host" id="page-host"></p>
      </section>

      <!-- Status lives here; the live region re-announces on every change. -->
      <section
        class="popup__status"
        id="status-region"
        role="status"
        aria-live="polite"
        data-kind="loading"
      >
        <span class="popup__status-icon" id="status-icon" aria-hidden="true"></span>
        <p class="popup__status-text" id="status-text">Loading…</p>
      </section>

      <p class="popup__queue" id="queue-summary" hidden></p>

      <form id="save-form">
        <button class="popup__save" id="save-button" type="submit" disabled>
          <span class="popup__save-label" id="save-label">Save page</span>
        </button>
      </form>

      <footer class="popup__footer">
        <button class="popup__open" id="open-app" type="button">Open Fluid Deck</button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
